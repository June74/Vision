name: Vision production release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to verify and release
        required: true
        default: main
        type: string
      confirmation:
        description: Type DEPLOY VISION PRODUCTION to authorize this release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vision-production-release
  cancel-in-progress: false

jobs:
  confirm:
    name: Confirm production release intent
    runs-on: ubuntu-latest
    outputs:
      confirmed: ${{ steps.confirmation.outputs.confirmed }}
    steps:
      - name: Require exact release confirmation
        id: confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$CONFIRMATION" != "DEPLOY VISION PRODUCTION" ]]; then
            echo "## Production release blocked" >> "$GITHUB_STEP_SUMMARY"
            echo "Type the exact confirmation phrase before a release can be verified." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "confirmed=true" >> "$GITHUB_OUTPUT"
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    needs: confirm
    if: ${{ needs.confirm.outputs.confirmed == 'true' }}
    outputs:
      verified_sha: ${{ steps.verified-ref.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
      - name: Resolve verified commit
        id: verified-ref
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run application checks
        run: pnpm check
      - name: Re-run the Phase B release security boundary
        id: release-security
        run: pnpm security:scan
      - name: Write safe release security summary
        if: ${{ always() }}
        shell: bash
        env:
          SCAN_OUTCOME: ${{ steps.release-security.outcome }}
        run: |
          mkdir -p dist/release-summary
          if [[ "$SCAN_OUTCOME" == "success" ]]; then
            STATUS="pass"
          else
            STATUS="fail"
          fi
          {
            printf 'status=%s\n' "$STATUS"
            printf 'safe_file_identifier=%s\n' 'dist/client'
            printf 'safe_file_identifier=%s\n' 'dist/release-evidence/application-logs/captured.ndjson'
            printf 'safe_file_identifier=%s\n' 'dist/release-evidence/audit/audit.ndjson'
            printf 'safe_file_identifier=%s\n' 'dist/release-evidence/queue/queue.ndjson'
            printf 'safe_file_identifier=%s\n' 'dist/release-evidence/database-raw/rows.ndjson'
            printf 'safe_file_identifier=%s\n' 'dist/release-evidence/r2-unencrypted/object.json'
            printf 'safe_file_identifier=%s\n' 'scripts/scan-release.ts'
          } > dist/release-summary/security-scan.txt
      - name: Upload safe release security summary
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vision-phase-b-security-summary
          path: dist/release-summary/security-scan.txt
          if-no-files-found: error
          retention-days: 30
      - name: Install Chromium for browser smoke coverage
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser smoke coverage
        run: pnpm test:e2e
  deploy:
    name: Release to production
    needs: [confirm, verify]
    if: ${{ needs.confirm.outputs.confirmed == 'true' && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.verify.outputs.verified_sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build explicit production artifact
        run: pnpm build
        env:
          CLOUDFLARE_ENV: production
      - name: Validate explicit production artifact
        run: pnpm deploy:check:production
      - name: Attest exact server-only AI pricing policy
        run: pnpm ai:pricing:attest --config dist/vision/wrangler.json --environment production
      - name: Dry-run explicit production artifact
        run: >-
          pnpm exec wrangler deploy --dry-run
          --config dist/vision/wrangler.json
          --outdir dist/production-dry-run
      - name: Deploy release Worker
        run: pnpm exec wrangler deploy --config dist/vision/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PRODUCTION }}
