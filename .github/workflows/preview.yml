name: Vision preview

on:
  workflow_dispatch:
    inputs:
      acceptance_operation:
        description: Closed preview acceptance operation
        required: true
        default: none
        type: choice
        options:
          - none
          - observe
          - deploy_foundation
          - deploy_sync_suppression
          - deploy_ai
          - deploy_fault
          - deploy_role_probe
          - deploy_restore
          - rollback
          - close_rollback
          - verify_cleanup
      acceptance_context:
        description: Canonical versioned context for the selected operation
        required: true
        type: string
      configure_ai_budget:
        description: Apply and verify the approved preview AI Gateway budget without deployment
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ inputs.acceptance_operation == 'observe' && inputs.configure_ai_budget == false && 'vision-preview-observer' || 'vision-preview-mutation' }}
  cancel-in-progress: false

jobs:
  selection:
    name: Admit one preview operation
    runs-on: ubuntu-latest
    outputs:
      reviewed_commit: ${{ steps.acceptance-selection.outputs.reviewed_commit }}
      candidate_run_ref: ${{ steps.acceptance-selection.outputs.candidate_run_ref }}
      rollback_run_ref: ${{ steps.acceptance-selection.outputs.rollback_run_ref }}
      rollback_closure_run_ref: ${{ steps.acceptance-selection.outputs.rollback_closure_run_ref }}
      authenticated_reads_gate: ${{ steps.acceptance-selection.outputs.authenticated_reads_gate }}
      fault_scenario: ${{ steps.acceptance-selection.outputs.fault_scenario }}
      evidence_family: ${{ steps.acceptance-selection.outputs.evidence_family }}
      expected_outcome: ${{ steps.acceptance-selection.outputs.expected_outcome }}
      observer_closes_at: ${{ steps.acceptance-selection.outputs.observer_closes_at }}
      maintenance_scheduled_at: ${{ steps.acceptance-selection.outputs.maintenance_scheduled_at }}
      selector: ${{ steps.acceptance-selection.outputs.selector }}
      restore_admission_gate: ${{ steps.acceptance-selection.outputs.restore_admission_gate }}
      observer_dispatch_started_at: ${{ steps.acceptance-selection.outputs.observer_dispatch_started_at }}
      observer_dispatch_completed_at: ${{ steps.acceptance-selection.outputs.observer_dispatch_completed_at }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
      - name: Resolve checked out commit
        id: checked-out
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify exact acceptance operation
        id: acceptance-selection
        shell: bash
        env:
          ACCEPTANCE_OPERATION: ${{ inputs.acceptance_operation }}
          ACCEPTANCE_CONTEXT: ${{ inputs.acceptance_context }}
          DISPATCH_SHA: ${{ github.sha }}
          CHECKED_OUT_SHA: ${{ steps.checked-out.outputs.sha }}
        run: |
          if [[ "${{ inputs.configure_ai_budget }}" == "true" && "${{ inputs.acceptance_operation }}" != "none" ]]; then
            exit 1
          fi
          pnpm exec tsx scripts/prepare-preview-acceptance-deploy-config.ts --verify-workflow-inputs

  verify:
    name: Verify preview candidate
    if: ${{ inputs.acceptance_operation != 'observe' && inputs.configure_ai_budget == false }}
    needs: selection
    runs-on: ubuntu-latest
    outputs:
      verified_sha: ${{ steps.verified-ref.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
      - name: Resolve verified commit
        id: verified-ref
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run application checks
        run: pnpm check
      - name: Install Chromium for browser smoke coverage
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser smoke coverage
        run: pnpm test:e2e

  deploy:
    name: Deploy normal preview
    if: ${{ inputs.acceptance_operation == 'none' && inputs.configure_ai_budget == false }}
    needs: verify
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Check preview deployment authorization
        id: preview-token
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW }}
          ACCEPTANCE_OPERATION: ${{ inputs.acceptance_operation }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "## Preview deployment blocked" >> "$GITHUB_STEP_SUMMARY"
            echo "CLOUDFLARE_API_TOKEN_PREVIEW is unavailable in the preview environment." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "## Preview deployment blocked" >> "$GITHUB_STEP_SUMMARY"
            echo "CLOUDFLARE_ACCOUNT_ID_PREVIEW is unavailable in the preview environment." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.verify.outputs.verified_sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build deployable preview artifact
        run: pnpm build
        env:
          CLOUDFLARE_ENV: preview
      - name: Verify preview deployment bindings
        run: pnpm deploy:check:preview
      - name: Deploy isolated preview Worker
        if: ${{ steps.preview-token.outputs.deploy == 'true' }}
        run: pnpm exec wrangler deploy --config dist/vision/wrangler.json --name vision-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW }}

  tail:
    name: Capture ${{ needs.selection.outputs.evidence_family }} signal
    if: ${{ inputs.acceptance_operation == 'observe' && inputs.configure_ai_budget == false && !contains(fromJSON('["calendar_maintenance","sync_suppression","restore","role_probe"]'), needs.selection.outputs.evidence_family) }}
    needs: selection
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
      - name: Verify observer checkout matches dispatch commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          REVIEWED_SHA: ${{ needs.selection.outputs.reviewed_commit }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          [[ "$actual_sha" == "$EXPECTED_SHA" ]]
          [[ "$actual_sha" == "$REVIEWED_SHA" ]]
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Print only allowlisted acceptance evidence
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW }}
          OBSERVER_EVIDENCE: ${{ needs.selection.outputs.evidence_family }}
          EXPECTED_OUTCOME: ${{ needs.selection.outputs.expected_outcome }}
          OBSERVER_CLOSES_AT: ${{ needs.selection.outputs.observer_closes_at }}
          FAULT_SCENARIO: ${{ needs.selection.outputs.fault_scenario }}
        run: |
          case "$OBSERVER_EVIDENCE" in
            calendar_maintenance) evidence_flag="--calendar-maintenance-only" ;;
            foundation_probe) evidence_flag="--foundation-probe-only" ;;
            ai_usage) evidence_flag="--ai-usage-only" ;;
            preview_fault) evidence_flag="--preview-fault-only" ;;
            *) exit 1 ;;
          esac
          scenario_args=()
          if [[ "$OBSERVER_EVIDENCE" == "preview_fault" ]]; then
            scenario_args=(--scenario "$FAULT_SCENARIO")
          fi
          set -o pipefail
          timeout 16m pnpm exec wrangler tail vision-preview --format json 2>/dev/null |
            pnpm exec tsx scripts/print-safe-tail.ts "$evidence_flag" \
              --expectation "$EXPECTED_OUTCOME" \
              --closes-at "$OBSERVER_CLOSES_AT" \
              "${scenario_args[@]}"

  suppression_signal:
    name: Capture sync_suppression signal
    if: ${{ inputs.acceptance_operation == 'observe' && needs.selection.outputs.evidence_family == 'sync_suppression' }}
    needs: selection
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { ref: "${{ github.sha }}" }
      - name: Verify observer checkout matches dispatch commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          REVIEWED_SHA: ${{ needs.selection.outputs.reviewed_commit }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          [[ "$actual_sha" == "$EXPECTED_SHA" ]]
          [[ "$actual_sha" == "$REVIEWED_SHA" ]]
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Print only allowlisted acceptance evidence
        run: |
          set -o pipefail
          timeout 16m pnpm exec wrangler tail vision-preview --format json 2>/dev/null |
            pnpm exec tsx scripts/print-safe-tail.ts --sync-suppression-signal-only \
              --expectation "$EXPECTED_OUTCOME" \
              --closes-at "$OBSERVER_CLOSES_AT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW }}
          EXPECTED_OUTCOME: ${{ needs.selection.outputs.expected_outcome }}
          OBSERVER_CLOSES_AT: ${{ needs.selection.outputs.observer_closes_at }}

  restore_signal:
    name: Capture restore signal
    if: ${{ inputs.acceptance_operation == 'observe' && needs.selection.outputs.evidence_family == 'restore' }}
    needs: selection
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { ref: "${{ github.sha }}" }
      - name: Verify observer checkout matches dispatch commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          REVIEWED_SHA: ${{ needs.selection.outputs.reviewed_commit }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          [[ "$actual_sha" == "$EXPECTED_SHA" ]]
          [[ "$actual_sha" == "$REVIEWED_SHA" ]]
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Print only allowlisted acceptance evidence
        run: |
          set -o pipefail
          timeout 16m pnpm exec wrangler tail vision-preview --format json 2>/dev/null |
            pnpm exec tsx scripts/print-safe-tail.ts --restore-signal-only \
              --expectation "$EXPECTED_OUTCOME" \
              --closes-at "$OBSERVER_CLOSES_AT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW }}
          EXPECTED_OUTCOME: ${{ needs.selection.outputs.expected_outcome }}
          OBSERVER_CLOSES_AT: ${{ needs.selection.outputs.observer_closes_at }}

  role_signal:
    name: Capture role_probe signal
    if: ${{ inputs.acceptance_operation == 'observe' && needs.selection.outputs.evidence_family == 'role_probe' }}
    needs: selection
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { ref: "${{ github.sha }}" }
      - name: Verify observer checkout matches dispatch commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          REVIEWED_SHA: ${{ needs.selection.outputs.reviewed_commit }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          [[ "$actual_sha" == "$EXPECTED_SHA" ]]
          [[ "$actual_sha" == "$REVIEWED_SHA" ]]
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Print only allowlisted acceptance evidence
        run: |
          set -o pipefail
          timeout 16m pnpm exec wrangler tail vision-preview --format json 2>/dev/null |
            pnpm exec tsx scripts/print-safe-tail.ts --role-probe-only \
              --expectation "$EXPECTED_OUTCOME" \
              --closes-at "$OBSERVER_CLOSES_AT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW }}
          EXPECTED_OUTCOME: ${{ needs.selection.outputs.expected_outcome }}
          OBSERVER_CLOSES_AT: ${{ needs.selection.outputs.observer_closes_at }}

  suppression_uniqueness:
    name: Capture sync_suppression uniqueness
    if: ${{ inputs.acceptance_operation == 'observe' && needs.selection.outputs.evidence_family == 'sync_suppression' }}
    needs: selection
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
      - name: Verify observer checkout matches dispatch commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          REVIEWED_SHA: ${{ needs.selection.outputs.reviewed_commit }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          [[ "$actual_sha" == "$EXPECTED_SHA" ]]
          [[ "$actual_sha" == "$REVIEWED_SHA" ]]
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Print only allowlisted acceptance evidence
        run: |
          set -o pipefail
          timeout 3m pnpm exec wrangler tail vision-preview --format json 2>/dev/null |
            pnpm exec tsx scripts/print-safe-tail.ts --sync-suppression-only \
              --expectation "$EXPECTED_OUTCOME" \
              --closes-at "$OBSERVER_CLOSES_AT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW }}
          EXPECTED_OUTCOME: ${{ needs.selection.outputs.expected_outcome }}
          OBSERVER_CLOSES_AT: ${{ needs.selection.outputs.observer_closes_at }}

  restore_uniqueness:
    name: Capture restore uniqueness
    if: ${{ inputs.acceptance_operation == 'observe' && needs.selection.outputs.evidence_family == 'restore' }}
    needs: selection
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { ref: "${{ github.sha }}" }
      - name: Verify observer checkout matches dispatch commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          REVIEWED_SHA: ${{ needs.selection.outputs.reviewed_commit }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          [[ "$actual_sha" == "$EXPECTED_SHA" ]]
          [[ "$actual_sha" == "$REVIEWED_SHA" ]]
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Print only allowlisted acceptance evidence
        run: |
          set -o pipefail
          timeout 3m pnpm exec wrangler tail vision-preview --format json 2>/dev/null |
            pnpm exec tsx scripts/print-safe-tail.ts --restore-only \
              --expectation "$EXPECTED_OUTCOME" \
              --closes-at "$OBSERVER_CLOSES_AT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW }}
          EXPECTED_OUTCOME: ${{ needs.selection.outputs.expected_outcome }}
          OBSERVER_CLOSES_AT: ${{ needs.selection.outputs.observer_closes_at }}

  maintenance_uniqueness:
    name: Capture calendar_maintenance uniqueness
    if: ${{ inputs.acceptance_operation == 'observe' && needs.selection.outputs.evidence_family == 'calendar_maintenance' }}
    needs: selection
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { ref: "${{ github.sha }}" }
      - name: Verify observer checkout matches dispatch commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          REVIEWED_SHA: ${{ needs.selection.outputs.reviewed_commit }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          [[ "$actual_sha" == "$EXPECTED_SHA" ]]
          [[ "$actual_sha" == "$REVIEWED_SHA" ]]
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Print only allowlisted acceptance evidence
        run: |
          set -o pipefail
          timeout 3m pnpm exec wrangler tail vision-preview --format json 2>/dev/null |
            pnpm exec tsx scripts/print-safe-tail.ts --calendar-maintenance-only \
              --expectation "$EXPECTED_OUTCOME" \
              --closes-at "$OBSERVER_CLOSES_AT" \
              --maintenance-scheduled-at "$MAINTENANCE_SCHEDULED_AT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW }}
          EXPECTED_OUTCOME: ${{ needs.selection.outputs.expected_outcome }}
          OBSERVER_CLOSES_AT: ${{ needs.selection.outputs.observer_closes_at }}
          MAINTENANCE_SCHEDULED_AT: ${{ needs.selection.outputs.maintenance_scheduled_at }}

  deploy_acceptance_candidate:
    name: Deploy one generated acceptance candidate
    if: ${{ inputs.acceptance_operation == 'deploy_foundation' || inputs.acceptance_operation == 'deploy_sync_suppression' || inputs.acceptance_operation == 'deploy_ai' || inputs.acceptance_operation == 'deploy_fault' || inputs.acceptance_operation == 'deploy_role_probe' || inputs.acceptance_operation == 'deploy_restore' }}
    needs: [selection, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    steps:
      - name: Check acceptance deployment authorization
        id: acceptance-token
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            exit 1
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.verify.outputs.verified_sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Require authenticated diagnostics and calendar operator gate
        shell: bash
        env:
          AUTHENTICATED_READS_GATE: ${{ needs.selection.outputs.authenticated_reads_gate }}
        run: |
          [[ "$AUTHENTICATED_READS_GATE" == "verified" ]]
      - name: Verify latest post-restore closure before candidate deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_REF: ${{ needs.selection.outputs.candidate_run_ref }}
          ROLLBACK_CLOSURE_RUN_ID: ${{ needs.selection.outputs.rollback_closure_run_ref }}
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
        run: |
          artifacts_file="$(mktemp)"
          closure_file="$(mktemp)"
          closure_run_file="$(mktemp)"
          closure_jobs_file="$(mktemp)"
          closure_dir="$(mktemp -d)"
          trap 'rm -f "$artifacts_file" "$closure_file" "$closure_run_file" "$closure_jobs_file"; rm -rf "$closure_dir"' EXIT
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=vision-preview-candidate-intent&per_page=100" > "$artifacts_file"
          pnpm exec tsx scripts/validate-preview-rollback-lifecycle.ts --verify-latest-candidate \
            --artifacts-file "$artifacts_file" \
            --candidate-run-ref "$CANDIDATE_RUN_REF"
          if [[ "$CANDIDATE_RUN_REF" == "baseline" ]]; then
            [[ "$ROLLBACK_CLOSURE_RUN_ID" == "baseline" ]]
            printf 'null\n' > "$closure_file"
          else
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ROLLBACK_CLOSURE_RUN_ID" > "$closure_run_file"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ROLLBACK_CLOSURE_RUN_ID/jobs" > "$closure_jobs_file"
            pnpm exec tsx scripts/validate-preview-rollback-lifecycle.ts --verify-run \
              --run-file "$closure_run_file" \
              --jobs-file "$closure_jobs_file" \
              --commit "$VERIFIED_SHA" \
              --job-name "Close restored normal preview"
            gh run download "$ROLLBACK_CLOSURE_RUN_ID" --name vision-preview-rollback-closed --dir "$closure_dir" > /dev/null
            closure_file="$closure_dir/preview-rollback-closure.json"
          fi
          pnpm exec tsx scripts/validate-preview-rollback-lifecycle.ts --verify-closure \
            --closure-proof "$closure_file" \
            --candidate-run-ref "$CANDIDATE_RUN_REF" \
            --commit "$VERIFIED_SHA" \
            --operation "${{ inputs.acceptance_operation }}"
      - name: Reject daily recovery overlap before candidate preparation
        run: pnpm exec tsx scripts/validate-preview-acceptance-window.ts
        env:
          ACCEPTANCE_OPERATION: ${{ inputs.acceptance_operation }}
          ACCEPTANCE_CONTEXT: ${{ inputs.acceptance_context }}
      - name: Verify active privacy-safe observer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OBSERVER_DISPATCH_STARTED_AT: ${{ needs.selection.outputs.observer_dispatch_started_at }}
          OBSERVER_DISPATCH_COMPLETED_AT: ${{ needs.selection.outputs.observer_dispatch_completed_at }}
          OBSERVER_EVIDENCE: ${{ needs.selection.outputs.evidence_family }}
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
        run: |
          pnpm exec tsx scripts/resolve-preview-observer-run.ts \
            --repository "$GITHUB_REPOSITORY" \
            --workflow ".github/workflows/preview.yml" \
            --sha "$VERIFIED_SHA" \
            --dispatch-started-at "$OBSERVER_DISPATCH_STARTED_AT" \
            --dispatch-completed-at "$OBSERVER_DISPATCH_COMPLETED_AT" \
            --family "$OBSERVER_EVIDENCE"
      - name: Verify live preview is normal before candidate deployment
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW }}
          ACCEPTANCE_OPERATION: ${{ inputs.acceptance_operation }}
        run: |
          health_file="$(mktemp)"
          schedules_file="$(mktemp)"
          settings_file="$(mktemp)"
          trap 'rm -f "$health_file" "$schedules_file" "$settings_file"' EXIT
          curl --fail --silent --show-error \
            "https://vision-preview.june74.workers.dev/api/health" > "$health_file"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/vision-preview/schedules" > "$schedules_file"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/vision-preview/settings" > "$settings_file"
          if [[ "$ACCEPTANCE_OPERATION" == "deploy_role_probe" || "$ACCEPTANCE_OPERATION" == "deploy_restore" ]]; then
            pnpm exec tsx scripts/validate-preview-deploy-config.ts \
              --verify-restore-pair-provider-state "$health_file" "$schedules_file" "$settings_file"
          else
            pnpm exec tsx scripts/validate-preview-deploy-config.ts \
              --verify-provider-state "$health_file" "$schedules_file" "$settings_file"
          fi
      - name: Build normal preview artifact
        run: pnpm build
        env:
          CLOUDFLARE_ENV: preview
      - name: Verify immutable normal artifact
        run: pnpm deploy:check:preview
      - name: Attest exact server-only AI pricing policy
        if: ${{ inputs.acceptance_operation == 'deploy_ai' || (inputs.acceptance_operation == 'deploy_fault' && needs.selection.outputs.fault_scenario == 'ai_stopped') }}
        run: pnpm ai:pricing:attest --config dist/vision/wrangler.json --environment preview
      - name: Verify the existing AI Gateway limit
        id: gateway-attestation
        if: ${{ inputs.acceptance_operation == 'deploy_ai' || (inputs.acceptance_operation == 'deploy_fault' && needs.selection.outputs.fault_scenario == 'ai_stopped') }}
        run: |
          pnpm gateway:verify:preview
          echo "attested=true" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW }}
      - name: Build generated acceptance candidate
        shell: bash
        env:
          ACCEPTANCE_OPERATION: ${{ inputs.acceptance_operation }}
          ACCEPTANCE_CONTEXT: ${{ inputs.acceptance_context }}
          DISPATCH_SHA: ${{ github.sha }}
          CHECKED_OUT_SHA: ${{ needs.verify.outputs.verified_sha }}
          AI_GATEWAY_LIMIT_ATTESTED: ${{ inputs.acceptance_operation == 'deploy_ai' && steps.gateway-attestation.outputs.attested || '' }}
        run: |
          pnpm exec tsx scripts/prepare-preview-acceptance-deploy-config.ts \
            --input dist/vision/wrangler.json \
            --output dist/vision/wrangler.acceptance.json \
            --ai-gateway-limit-attested "$AI_GATEWAY_LIMIT_ATTESTED"
      - name: Write candidate intent before preview mutation
        run: |
          pnpm exec tsx scripts/validate-preview-rollback-lifecycle.ts --write-candidate-intent \
            --commit "${{ needs.verify.outputs.verified_sha }}" \
            --operation "${{ inputs.acceptance_operation }}" \
            --output preview-candidate-intent.json
      - name: Upload candidate intent before preview mutation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vision-preview-candidate-intent
          path: preview-candidate-intent.json
          if-no-files-found: error
          retention-days: 30
      - name: Reverify active matching observer immediately before deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OBSERVER_DISPATCH_STARTED_AT: ${{ needs.selection.outputs.observer_dispatch_started_at }}
          OBSERVER_DISPATCH_COMPLETED_AT: ${{ needs.selection.outputs.observer_dispatch_completed_at }}
          OBSERVER_EVIDENCE: ${{ needs.selection.outputs.evidence_family }}
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
        run: |
          pnpm exec tsx scripts/resolve-preview-observer-run.ts \
            --repository "$GITHUB_REPOSITORY" \
            --workflow ".github/workflows/preview.yml" \
            --sha "$VERIFIED_SHA" \
            --dispatch-started-at "$OBSERVER_DISPATCH_STARTED_AT" \
            --dispatch-completed-at "$OBSERVER_DISPATCH_COMPLETED_AT" \
            --family "$OBSERVER_EVIDENCE"
      - name: Recheck daily recovery overlap immediately before deploy
        run: pnpm exec tsx scripts/validate-preview-acceptance-window.ts --candidate dist/vision/wrangler.acceptance.json
      - name: Deploy generated acceptance candidate
        if: ${{ steps.acceptance-token.outputs.deploy == 'true' }}
        run: pnpm exec wrangler deploy --config dist/vision/wrangler.acceptance.json --name vision-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW }}

  rollback:
    name: Restore immutable normal preview
    if: ${{ inputs.acceptance_operation == 'rollback' && inputs.configure_ai_budget == false }}
    needs: [selection, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    steps:
      - name: Check rollback authorization
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.verify.outputs.verified_sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify rollback targets the latest candidate intent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_REF: ${{ needs.selection.outputs.candidate_run_ref }}
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
        run: |
          artifacts_file="$(mktemp)"
          candidate_dir="$(mktemp -d)"
          trap 'rm -f "$artifacts_file"; rm -rf "$candidate_dir"' EXIT
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=vision-preview-candidate-intent&per_page=100" > "$artifacts_file"
          pnpm exec tsx scripts/validate-preview-rollback-lifecycle.ts --verify-latest-candidate \
            --artifacts-file "$artifacts_file" \
            --candidate-run-ref "$CANDIDATE_RUN_REF"
          gh run download "$CANDIDATE_RUN_REF" --name vision-preview-candidate-intent --dir "$candidate_dir" > /dev/null
          cp "$candidate_dir/preview-candidate-intent.json" preview-candidate-intent.json
          pnpm exec tsx scripts/validate-preview-rollback-lifecycle.ts --verify-candidate-intent \
            --candidate-intent preview-candidate-intent.json \
            --commit "$VERIFIED_SHA"
      - name: Verify candidate-profile provider state before rollback
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW }}
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
        run: |
          health_file="$(mktemp)"
          schedules_file="$(mktemp)"
          settings_file="$(mktemp)"
          trap 'rm -f "$health_file" "$schedules_file" "$settings_file"' EXIT
          curl --fail --silent --show-error \
            "https://vision-preview.june74.workers.dev/api/health" > "$health_file"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/vision-preview/schedules" > "$schedules_file"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/vision-preview/settings" > "$settings_file"
          pnpm exec tsx scripts/validate-preview-deploy-config.ts \
            --verify-candidate-provider-state \
            preview-candidate-intent.json \
            "$VERIFIED_SHA" \
            "$health_file" \
            "$schedules_file" \
            "$settings_file"
      - name: Build immutable normal artifact
        run: pnpm build
        env:
          CLOUDFLARE_ENV: preview
      - name: Validate immutable normal artifact
        run: pnpm deploy:check:preview
      - name: Deploy immutable normal preview Worker
        id: rollback-deploy
        run: |
          pnpm exec wrangler deploy --config dist/vision/wrangler.json --name vision-preview
          node -e 'process.stdout.write(`restored_at=${new Date().toISOString()}\n`)' >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW }}
      - name: Verify normal runtime and temporary-surface absence
        id: rollback-provider
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW }}
        run: |
          health_file="$(mktemp)"
          schedules_file="$(mktemp)"
          settings_file="$(mktemp)"
          trap 'rm -f "$health_file" "$schedules_file" "$settings_file"' EXIT
          curl --fail --silent --show-error \
            "https://vision-preview.june74.workers.dev/api/health" > "$health_file"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/vision-preview/schedules" > "$schedules_file"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/vision-preview/settings" > "$settings_file"
          pnpm exec tsx scripts/validate-preview-deploy-config.ts \
            --verify-provider-state "$health_file" "$schedules_file" "$settings_file"
          node -e 'process.stdout.write(`provider_verified_at=${new Date().toISOString()}\n`)' >> "$GITHUB_OUTPUT"
      - name: Write privacy-safe restored-normal proof
        run: |
          pnpm exec tsx scripts/validate-preview-rollback-lifecycle.ts --write-restore-proof \
            --candidate-intent preview-candidate-intent.json \
            --candidate-run-ref "${{ needs.selection.outputs.candidate_run_ref }}" \
            --commit "${{ needs.verify.outputs.verified_sha }}" \
            --restored-at "${{ steps.rollback-deploy.outputs.restored_at }}" \
            --provider-verified-at "${{ steps.rollback-provider.outputs.provider_verified_at }}" \
            --provider-state "verified" \
            --output preview-rollback-restored.json
      - name: Upload restored-normal proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vision-preview-rollback-restored
          path: preview-rollback-restored.json
          if-no-files-found: error
          retention-days: 30

  close_rollback:
    name: Close restored normal preview
    if: ${{ inputs.acceptance_operation == 'close_rollback' && inputs.configure_ai_budget == false }}
    needs: [selection, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    steps:
      - name: Check closure verification authorization
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.verify.outputs.verified_sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify completed rollback run and restored-normal proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLBACK_RUN_ID: ${{ needs.selection.outputs.rollback_run_ref }}
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
        run: |
          run_file="$(mktemp)"
          jobs_file="$(mktemp)"
          proof_dir="$(mktemp -d)"
          trap 'rm -f "$run_file" "$jobs_file"; rm -rf "$proof_dir"' EXIT
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ROLLBACK_RUN_ID" > "$run_file"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ROLLBACK_RUN_ID/jobs" > "$jobs_file"
          pnpm exec tsx scripts/validate-preview-rollback-lifecycle.ts --verify-run \
            --run-file "$run_file" \
            --jobs-file "$jobs_file" \
            --commit "$VERIFIED_SHA" \
            --job-name "Restore immutable normal preview"
          gh run download "$ROLLBACK_RUN_ID" --name vision-preview-rollback-restored --dir "$proof_dir" > /dev/null
          cp "$proof_dir/preview-rollback-restored.json" preview-rollback-restored.json
      - name: Build and validate immutable normal artifact for closure
        run: |
          pnpm build
          pnpm deploy:check:preview
        env:
          CLOUDFLARE_ENV: preview
      - name: Reverify normal provider state before rollback closure
        id: closure-provider
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW }}
        run: |
          health_file="$(mktemp)"
          schedules_file="$(mktemp)"
          settings_file="$(mktemp)"
          trap 'rm -f "$health_file" "$schedules_file" "$settings_file"' EXIT
          public_origin="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; const config = JSON.parse(readFileSync("dist/vision/wrangler.json", "utf8")); process.stdout.write(new URL(config.vars.GOOGLE_OAUTH_REDIRECT_URI).origin)')"
          provider_origin="$(printf '%s%s' 'https:' '//api.cloudflare.com/client/v4')"
          curl --fail --silent --show-error "$public_origin/api/health" > "$health_file"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$provider_origin/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/vision-preview/schedules" > "$schedules_file"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$provider_origin/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/vision-preview/settings" > "$settings_file"
          pnpm exec tsx scripts/validate-preview-deploy-config.ts \
            --verify-provider-state "$health_file" "$schedules_file" "$settings_file"
          node -e 'process.stdout.write(`provider_verified_at=${new Date().toISOString()}\n`)' >> "$GITHUB_OUTPUT"
      - name: Close rollback after post-restore authenticated reads
        shell: bash
        env:
          AUTHENTICATED_READS_GATE: ${{ needs.selection.outputs.authenticated_reads_gate }}
        run: |
          pnpm exec tsx scripts/validate-preview-rollback-lifecycle.ts --close-rollback \
            --restore-proof preview-rollback-restored.json \
            --candidate-run-ref "${{ needs.selection.outputs.candidate_run_ref }}" \
            --commit "${{ needs.verify.outputs.verified_sha }}" \
            --authenticated-reads-gate "$AUTHENTICATED_READS_GATE" \
            --closure-provider-verified-at "${{ steps.closure-provider.outputs.provider_verified_at }}" \
            --closed-at "$(node -e 'process.stdout.write(new Date().toISOString())')" \
            --output preview-rollback-closure.json
      - name: Upload rollback closure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vision-preview-rollback-closed
          path: preview-rollback-closure.json
          if-no-files-found: error
          retention-days: 30

  verify_cleanup:
    name: Verify cleanup admission
    if: ${{ inputs.acceptance_operation == 'verify_cleanup' && inputs.configure_ai_budget == false }}
    needs: [selection, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.verify.outputs.verified_sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify rollback closure before provider cleanup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_REF: ${{ needs.selection.outputs.candidate_run_ref }}
          ROLLBACK_CLOSURE_RUN_ID: ${{ needs.selection.outputs.rollback_closure_run_ref }}
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
        run: |
          artifacts_file="$(mktemp)"
          run_file="$(mktemp)"
          jobs_file="$(mktemp)"
          closure_dir="$(mktemp -d)"
          trap 'rm -f "$artifacts_file" "$run_file" "$jobs_file"; rm -rf "$closure_dir"' EXIT
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=vision-preview-candidate-intent&per_page=100" > "$artifacts_file"
          pnpm exec tsx scripts/validate-preview-rollback-lifecycle.ts --verify-latest-candidate \
            --artifacts-file "$artifacts_file" \
            --candidate-run-ref "$CANDIDATE_RUN_REF"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ROLLBACK_CLOSURE_RUN_ID" > "$run_file"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ROLLBACK_CLOSURE_RUN_ID/jobs" > "$jobs_file"
          pnpm exec tsx scripts/validate-preview-rollback-lifecycle.ts --verify-run \
            --run-file "$run_file" \
            --jobs-file "$jobs_file" \
            --commit "$VERIFIED_SHA" \
            --job-name "Close restored normal preview"
          gh run download "$ROLLBACK_CLOSURE_RUN_ID" --name vision-preview-rollback-closed --dir "$closure_dir" > /dev/null
          pnpm exec tsx scripts/validate-preview-rollback-lifecycle.ts --verify-closure \
            --closure-proof "$closure_dir/preview-rollback-closure.json" \
            --candidate-run-ref "$CANDIDATE_RUN_REF" \
            --commit "$VERIFIED_SHA" \
            --operation "verify_cleanup"
          echo "Provider cleanup remains forbidden until the post-restore closure gate succeeds." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify temporary names absent and strict normal provider state
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            exit 1
          fi
          health_file="$(mktemp)"
          schedules_file="$(mktemp)"
          settings_file="$(mktemp)"
          trap 'rm -f "$health_file" "$schedules_file" "$settings_file"' EXIT
          curl --fail --silent --show-error \
            "https://vision-preview.june74.workers.dev/api/health" > "$health_file"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/vision-preview/schedules" > "$schedules_file"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/vision-preview/settings" > "$settings_file"
          pnpm exec tsx scripts/validate-preview-deploy-config.ts \
            --verify-provider-state "$health_file" "$schedules_file" "$settings_file"

  configure_gateway:
    name: Configure approved AI Gateway budget
    if: ${{ inputs.configure_ai_budget == true && inputs.acceptance_operation == 'none' }}
    needs: selection
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply and verify only the approved global budget
        run: pnpm gateway:configure:preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW }}
