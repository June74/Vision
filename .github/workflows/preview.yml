name: Vision preview

on:
  workflow_dispatch:
    inputs:
      acceptance_operation:
        description: Closed preview acceptance operation
        required: true
        default: none
        type: choice
        options:
          - none
          - observe
          - deploy_foundation
          - deploy_ai
          - deploy_fault
          - rollback
      fault_scenario:
        description: Closed fault selector used only with deploy_fault
        required: true
        default: none
        type: choice
        options:
          - none
          - queue_delayed
          - job_failed
          - channel_expired
          - database_unavailable
          - r2_upload_failed
          - ai_stopped
      authenticated_reads_gate:
        description: Operator attestation for authenticated diagnostics and calendar reads
        required: true
        default: not_verified
        type: choice
        options:
          - not_verified
          - verified
      observer_evidence:
        description: Privacy-safe terminal type for the non-mutating observer
        required: true
        default: calendar_maintenance
        type: choice
        options:
          - calendar_maintenance
          - foundation_probe
          - ai_usage
          - preview_fault
      observer_run_id:
        description: Active observe-operation run required for candidate deployment
        required: false
        default: ""
        type: string
      configure_ai_budget:
        description: Apply and verify the approved preview AI Gateway budget without deployment
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ inputs.acceptance_operation == 'observe' && inputs.configure_ai_budget == false && 'vision-preview-observer' || 'vision-preview-mutation' }}
  cancel-in-progress: true

jobs:
  selection:
    name: Admit one preview operation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify exact acceptance operation
        shell: bash
        run: |
          if [[ "${{ inputs.configure_ai_budget }}" == "true" && "${{ inputs.acceptance_operation }}" != "none" ]]; then
            exit 1
          fi
          pnpm exec tsx scripts/prepare-preview-acceptance-deploy-config.ts --verify-workflow-inputs \
            --operation "${{ inputs.acceptance_operation }}" \
            --fault-scenario "${{ inputs.fault_scenario }}" \
            --authenticated-reads-gate "${{ inputs.authenticated_reads_gate }}"

  verify:
    name: Verify preview candidate
    if: ${{ inputs.acceptance_operation != 'observe' && inputs.configure_ai_budget == false }}
    needs: selection
    runs-on: ubuntu-latest
    outputs:
      verified_sha: ${{ steps.verified-ref.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
      - name: Resolve verified commit
        id: verified-ref
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run application checks
        run: pnpm check
      - name: Install Chromium for browser smoke coverage
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser smoke coverage
        run: pnpm test:e2e

  deploy:
    name: Deploy normal preview
    if: ${{ inputs.acceptance_operation == 'none' && inputs.configure_ai_budget == false }}
    needs: verify
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Check preview deployment authorization
        id: preview-token
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "## Preview deployment blocked" >> "$GITHUB_STEP_SUMMARY"
            echo "CLOUDFLARE_API_TOKEN_PREVIEW is unavailable in the preview environment." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "## Preview deployment blocked" >> "$GITHUB_STEP_SUMMARY"
            echo "CLOUDFLARE_ACCOUNT_ID_PREVIEW is unavailable in the preview environment." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.verify.outputs.verified_sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build deployable preview artifact
        run: pnpm build
        env:
          CLOUDFLARE_ENV: preview
      - name: Verify preview deployment bindings
        run: pnpm deploy:check:preview
      - name: Deploy isolated preview Worker
        if: ${{ steps.preview-token.outputs.deploy == 'true' }}
        run: pnpm exec wrangler deploy --config dist/vision/wrangler.json --name vision-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW }}

  tail:
    name: Capture ${{ inputs.observer_evidence }} safe scheduled outcome
    if: ${{ inputs.acceptance_operation == 'observe' && inputs.configure_ai_budget == false }}
    needs: selection
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
      - name: Verify observer checkout matches dispatch commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          [[ "$actual_sha" == "$EXPECTED_SHA" ]]
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Print only allowlisted acceptance evidence
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW }}
          OBSERVER_EVIDENCE: ${{ inputs.observer_evidence }}
        run: |
          case "$OBSERVER_EVIDENCE" in
            calendar_maintenance) evidence_flag="--calendar-maintenance-only" ;;
            foundation_probe) evidence_flag="--foundation-probe-only" ;;
            ai_usage) evidence_flag="--ai-usage-only" ;;
            preview_fault) evidence_flag="--preview-fault-only" ;;
            *) exit 1 ;;
          esac
          set +o pipefail
          timeout 16m pnpm exec wrangler tail vision-preview --format json 2>/dev/null |
            pnpm exec tsx scripts/print-safe-tail.ts "$evidence_flag"

  deploy_acceptance_candidate:
    name: Deploy one generated acceptance candidate
    if: ${{ inputs.acceptance_operation == 'deploy_foundation' || inputs.acceptance_operation == 'deploy_ai' || inputs.acceptance_operation == 'deploy_fault' }}
    needs: verify
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Check acceptance deployment authorization
        id: acceptance-token
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            exit 1
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.verify.outputs.verified_sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Require authenticated diagnostics and calendar operator gate
        shell: bash
        env:
          AUTHENTICATED_READS_GATE: ${{ inputs.authenticated_reads_gate }}
        run: |
          [[ "$AUTHENTICATED_READS_GATE" == "verified" ]]
      - name: Reject daily recovery overlap before candidate preparation
        run: pnpm exec tsx scripts/validate-preview-acceptance-window.ts
      - name: Verify active privacy-safe observer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_OPERATION: ${{ inputs.acceptance_operation }}
          OBSERVER_RUN_ID: ${{ inputs.observer_run_id }}
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
        run: |
          if ! [[ "$OBSERVER_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]; then
            exit 1
          fi
          case "$ACCEPTANCE_OPERATION" in
            deploy_foundation) expected_observer_evidence="foundation_probe" ;;
            deploy_ai) expected_observer_evidence="ai_usage" ;;
            deploy_fault) expected_observer_evidence="preview_fault" ;;
            *) exit 1 ;;
          esac
          run_file="$(mktemp)"
          jobs_file="$(mktemp)"
          trap 'rm -f "$run_file" "$jobs_file"' EXIT
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$OBSERVER_RUN_ID" > "$run_file"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$OBSERVER_RUN_ID/jobs" > "$jobs_file"
          jq -e --arg sha "$VERIFIED_SHA" '
            .event == "workflow_dispatch" and
            .status == "in_progress" and
            .conclusion == null and
            .head_sha == $sha and
            (
              .path == ".github/workflows/preview.yml" or
              (.path | startswith(".github/workflows/preview.yml@refs/"))
            )
          ' "$run_file" > /dev/null
          pnpm exec tsx scripts/validate-preview-observer-state.ts \
            --run-file "$run_file" \
            --jobs-file "$jobs_file" \
            --sha "$VERIFIED_SHA" \
            --evidence "$expected_observer_evidence"
      - name: Verify live preview is normal before candidate deployment
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW }}
        run: |
          health_file="$(mktemp)"
          schedules_file="$(mktemp)"
          settings_file="$(mktemp)"
          trap 'rm -f "$health_file" "$schedules_file" "$settings_file"' EXIT
          curl --fail --silent --show-error \
            "https://vision-preview.june74.workers.dev/api/health" > "$health_file"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/vision-preview/schedules" > "$schedules_file"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/vision-preview/settings" > "$settings_file"
          pnpm exec tsx scripts/validate-preview-deploy-config.ts \
            --verify-provider-state "$health_file" "$schedules_file" "$settings_file"
      - name: Build normal preview artifact
        run: pnpm build
        env:
          CLOUDFLARE_ENV: preview
      - name: Verify immutable normal artifact
        run: pnpm deploy:check:preview
      - name: Verify the existing AI Gateway limit
        id: gateway-attestation
        if: ${{ inputs.acceptance_operation == 'deploy_ai' || (inputs.acceptance_operation == 'deploy_fault' && inputs.fault_scenario == 'ai_stopped') }}
        run: |
          pnpm gateway:verify:preview
          echo "attested=true" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW }}
      - name: Build generated acceptance candidate
        shell: bash
        env:
          AI_GATEWAY_LIMIT_ATTESTED: ${{ inputs.acceptance_operation == 'deploy_ai' && steps.gateway-attestation.outputs.attested || '' }}
        run: |
          pnpm exec tsx scripts/prepare-preview-acceptance-deploy-config.ts \
            --operation "${{ inputs.acceptance_operation }}" \
            --fault-scenario "${{ inputs.fault_scenario }}" \
            --authenticated-reads-gate "${{ inputs.authenticated_reads_gate }}" \
            --input dist/vision/wrangler.json \
            --output dist/vision/wrangler.acceptance.json \
            --ai-gateway-limit-attested "$AI_GATEWAY_LIMIT_ATTESTED"
      - name: Recheck daily recovery overlap immediately before deploy
        run: pnpm exec tsx scripts/validate-preview-acceptance-window.ts
      - name: Reverify active matching observer immediately before deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_OPERATION: ${{ inputs.acceptance_operation }}
          OBSERVER_RUN_ID: ${{ inputs.observer_run_id }}
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
        run: |
          if ! [[ "$OBSERVER_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]; then
            exit 1
          fi
          case "$ACCEPTANCE_OPERATION" in
            deploy_foundation) expected_observer_evidence="foundation_probe" ;;
            deploy_ai) expected_observer_evidence="ai_usage" ;;
            deploy_fault) expected_observer_evidence="preview_fault" ;;
            *) exit 1 ;;
          esac
          run_file="$(mktemp)"
          jobs_file="$(mktemp)"
          trap 'rm -f "$run_file" "$jobs_file"' EXIT
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$OBSERVER_RUN_ID" > "$run_file"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$OBSERVER_RUN_ID/jobs" > "$jobs_file"
          jq -e --arg sha "$VERIFIED_SHA" '
            .event == "workflow_dispatch" and
            .status == "in_progress" and
            .conclusion == null and
            .head_sha == $sha and
            (
              .path == ".github/workflows/preview.yml" or
              (.path | startswith(".github/workflows/preview.yml@refs/"))
            )
          ' "$run_file" > /dev/null
          pnpm exec tsx scripts/validate-preview-observer-state.ts \
            --run-file "$run_file" \
            --jobs-file "$jobs_file" \
            --sha "$VERIFIED_SHA" \
            --evidence "$expected_observer_evidence"
      - name: Deploy generated acceptance candidate
        if: ${{ steps.acceptance-token.outputs.deploy == 'true' }}
        run: pnpm exec wrangler deploy --config dist/vision/wrangler.acceptance.json --name vision-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW }}

  rollback:
    name: Restore immutable normal preview
    if: ${{ inputs.acceptance_operation == 'rollback' && inputs.configure_ai_budget == false }}
    needs: verify
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Check rollback authorization
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.verify.outputs.verified_sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build immutable normal artifact
        run: pnpm build
        env:
          CLOUDFLARE_ENV: preview
      - name: Validate immutable normal artifact
        run: pnpm deploy:check:preview
      - name: Require rollback authenticated diagnostics and calendar operator gate
        shell: bash
        env:
          AUTHENTICATED_READS_GATE: ${{ inputs.authenticated_reads_gate }}
        run: |
          [[ "$AUTHENTICATED_READS_GATE" == "verified" ]]
      - name: Deploy immutable normal preview Worker
        run: pnpm exec wrangler deploy --config dist/vision/wrangler.json --name vision-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW }}
      - name: Verify normal runtime and temporary-surface absence
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW }}
        run: |
          health_file="$(mktemp)"
          schedules_file="$(mktemp)"
          settings_file="$(mktemp)"
          trap 'rm -f "$health_file" "$schedules_file" "$settings_file"' EXIT
          curl --fail --silent --show-error \
            "https://vision-preview.june74.workers.dev/api/health" > "$health_file"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/vision-preview/schedules" > "$schedules_file"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/vision-preview/settings" > "$settings_file"
          pnpm exec tsx scripts/validate-preview-deploy-config.ts \
            --verify-provider-state "$health_file" "$schedules_file" "$settings_file"
          echo "Provider cleanup is forbidden until this rollback verification succeeds." >> "$GITHUB_STEP_SUMMARY"

  configure_gateway:
    name: Configure approved AI Gateway budget
    if: ${{ inputs.configure_ai_budget == true && inputs.acceptance_operation == 'none' && inputs.fault_scenario == 'none' }}
    needs: selection
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply and verify only the approved global budget
        run: pnpm gateway:configure:preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW }}
