name: Vision preview

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build and deploy
        required: false
        default: main
        type: string
      safe_tail:
        description: Capture one privacy-safe scheduled outcome without deployment
        required: false
        default: false
        type: boolean
      configure_ai_budget:
        description: Apply and verify the approved preview AI Gateway budget without deployment
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ inputs.safe_tail == true && inputs.configure_ai_budget == false && 'vision-preview-observer' || 'vision-preview-mutation' }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify preview candidate
    if: ${{ inputs.safe_tail == false && inputs.configure_ai_budget == false }}
    runs-on: ubuntu-latest
    outputs:
      verified_sha: ${{ steps.verified-ref.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - name: Resolve verified commit
        id: verified-ref
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run application checks
        run: pnpm check
      - name: Install Chromium for browser smoke coverage
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser smoke coverage
        run: pnpm test:e2e
  deploy:
    name: Deploy preview
    if: ${{ inputs.safe_tail == false && inputs.configure_ai_budget == false }}
    needs: verify
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Check preview deployment authorization
        id: preview-token
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "## Preview deployment blocked" >> "$GITHUB_STEP_SUMMARY"
            echo "CLOUDFLARE_API_TOKEN_PREVIEW is unavailable in the preview environment." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "## Preview deployment blocked" >> "$GITHUB_STEP_SUMMARY"
            echo "CLOUDFLARE_ACCOUNT_ID_PREVIEW is unavailable in the preview environment." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.verify.outputs.verified_sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build deployable preview artifact
        run: pnpm build
        env:
          CLOUDFLARE_ENV: preview
      - name: Verify preview deployment bindings
        run: pnpm deploy:check:preview
      - name: Deploy isolated preview Worker
        if: ${{ steps.preview-token.outputs.deploy == 'true' }}
        run: pnpm exec wrangler deploy --config dist/vision/wrangler.json --name vision-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW }}

  tail:
    name: Capture one safe scheduled outcome
    if: ${{ inputs.safe_tail == true && inputs.configure_ai_budget == false }}
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Print only allowlisted scheduled evidence
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW }}
        run: |
          set +o pipefail
          timeout 16m pnpm exec wrangler tail vision-preview --format json 2>/dev/null |
            pnpm exec tsx scripts/print-safe-tail.ts --calendar-maintenance-only

  configure_gateway:
    name: Configure approved AI Gateway budget
    if: ${{ inputs.configure_ai_budget == true && inputs.safe_tail == false }}
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply and verify only the approved global budget
        run: pnpm gateway:configure:preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW }}
